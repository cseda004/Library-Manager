<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="coverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3584e4"/>
      <stop offset="100%" stop-color="#1c71d8"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f6d32d"/>
      <stop offset="100%" stop-color="#e5a50a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Outer Book Shadow -->
  <g filter="url(#shadow)">
    <!-- Back Cover -->
    <rect x="20" y="16" width="88" height="96" rx="8" fill="#185fb4"/>
    
    <!-- Pages Layer -->
    <rect x="26" y="20" width="80" height="88" rx="4" fill="#f6f5f4"/>
    <path d="M 102 20 L 106 20 A 2 2 0 0 1 108 22 L 108 106 A 2 2 0 0 1 106 108 L 102 108 Z" fill="#e1dedb"/>
    <line x1="30" y1="32" x2="98" y2="32" stroke="#dc322f" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.3"/>
    
    <!-- Main Cover -->
    <rect x="20" y="16" width="82" height="96" rx="6" fill="url(#coverGrad)"/>
    
    <!-- Spine Line -->
    <rect x="28" y="16" width="3" height="96" fill="#1c71d8" opacity="0.5"/>
    <rect x="29" y="16" width="1" height="96" fill="#ffffff" opacity="0.2"/>

    <!-- Gold Bookmark Ribbon -->
    <path d="M 72 16 L 86 16 L 86 64 L 79 56 L 72 64 Z" fill="url(#accentGrad)"/>

    <!-- Decorative Gold Emblem -->
    <circle cx="56" cy="54" r="16" fill="none" stroke="url(#accentGrad)" stroke-width="3"/>
    <path d="M 50 54 L 62 54 M 56 48 L 56 60" stroke="url(#accentGrad)" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
